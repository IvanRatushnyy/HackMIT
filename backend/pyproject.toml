[project]
name = "elute-backend"
version = "0.1.0"
description = "Elute backend: evidence-grounded appraisal of a drug–disease hypothesis (BACKEND_PLAN v4.4 FINAL, Phase 1)"
requires-python = ">=3.12"
dependencies = [
  "tooluniverse==1.5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.66",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elute*"]
